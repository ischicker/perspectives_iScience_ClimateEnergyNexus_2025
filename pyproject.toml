[project]
name = "alpinemet"
version = "0.1.0.dev0"
description = "Multi-scale weather and climate data evaluation for Alpine renewable energy applications"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Irene Schicker", email = "irene.schicker@geosphere.at" },
]
maintainers = [
    { name = "Irene Schicker", email = "irene.schicker@geosphere.at" },
]
keywords = [
    "renewable-energy", "reanalysis", "complex-terrain", "alps",
    "digital-twin", "destination-earth", "energy-meteorology",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "xarray>=2023.6",
    "scipy>=1.10",
    "dask[array,diagnostics]>=2023.5",
    "netCDF4>=1.6",
    "h5netcdf>=1.2",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "cartopy>=0.22",
    "seaborn>=0.13",
    "rasterio>=1.3",
    "shapely>=2.0",
    "pyproj>=3.5",
    "fsspec>=2023.6",
    "psutil>=5.9",
]

[project.optional-dependencies]
# Solarleistung nach der im Paper beschriebenen Methodik
energy = ["pvlib>=0.10"]
# Datenbeschaffung: CDS, DestinE/Polytope, GRIB-Dekodierung
acquisition = [
    "cdsapi>=0.6",
    "earthkit-data>=0.6",
    "polytope-client>=0.7",
    "cfgrib>=0.9.10",
    "eccodes>=1.6",
]
# Erzeugung der Supplementary-Tabelle S1
docs-export = ["python-docx>=1.1"]
all = ["alpinemet[energy,acquisition,docs-export]"]

[project.scripts]
alpinemet = "alpinemet.cli:main"

[project.urls]
Homepage = "https://github.com/ischicker/perspectives_iScience_ClimateEnergyNexus_2025"
Repository = "https://github.com/ischicker/perspectives_iScience_ClimateEnergyNexus_2025"
Publication = "https://doi.org/10.1016/j.isci.2026.116855"

[dependency-groups]
dev = [
    "pvlib>=0.10",   # required to exercise the solar chain in tests
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "nbstripout>=0.7",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "pyarrow>=17.0",   # reading the cached station parquet files
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alpinemet"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "NPY", "PD"]
ignore = [
    "E501",    # line length is handled by the formatter
    "B008",
    # PD011 flags xarray's canonical .values accessor as a pandas antipattern.
    # This is an xarray codebase, so the rule is a permanent false positive.
    "PD011",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"notebooks/*" = ["E402", "PD010"]  # .pivot reads better than .pivot_table in a demo

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: Tests, die groessere Rechenzeit brauchen",
    "requires_data: Tests, die echte Rohdaten voraussetzen (in CI uebersprungen)",
]
filterwarnings = ["error::DeprecationWarning:alpinemet.*"]

[tool.coverage.run]
source = ["src/alpinemet"]
branch = true
